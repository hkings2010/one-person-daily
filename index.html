<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23f5f2ea'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='13'%20fill='%23bf3b2b'/%3E%3C/svg%3E">

<title>一人公司日报 · 2026.11.27</title>
<style>
  :root{
    --bg:#f5f2ea;
    --card:#fffcf5;
    --ink:#191713;
    --ink-2:#403a32;
    --muted:#786f61;
    --line:#e4ddcf;
    --line-strong:#cfc5b3;
    --accent:#bf3b2b;
    --accent-2:#8f2a1e;
    --accent-soft:#f4e3de;
    --chip:#efe9dc;
    --dots:rgba(25,23,19,.035);
    --shadow:0 1px 2px rgba(25,23,19,.04),0 10px 26px rgba(25,23,19,.045);
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",STSong,SimSun,serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12110f;
      --card:#1a1916;
      --ink:#eee8dc;
      --ink-2:#d3cbbb;
      --muted:#a09887;
      --line:#2b2822;
      --line-strong:#3d3830;
      --accent:#e2604b;
      --accent-2:#f08a77;
      --accent-soft:#33201b;
      --chip:#24211b;
      --dots:rgba(255,255,255,.025);
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.28);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    color:var(--ink);
    background-color:var(--bg);
    background-image:radial-gradient(circle at 1px 1px, var(--dots) 1px, transparent 0);
    background-size:22px 22px;
    font-family:var(--sans);
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit}
  button{font:inherit;color:inherit}
  button,input{font-family:inherit}
  ::selection{background:var(--accent);color:#fff}
  .skip{
    position:absolute;left:-9999px;top:0;background:var(--ink);color:var(--bg);
    padding:10px 14px;border-radius:0 0 8px 0;z-index:200;
  }
  .skip:focus{left:0}
  .page{max-width:760px;margin:0 auto;padding:22px 18px calc(64px + env(safe-area-inset-bottom))}
  .kicker{
    display:flex;justify-content:space-between;gap:12px;
    font-size:10.5px;letter-spacing:.16em;color:var(--muted);
    text-transform:uppercase;
  }
  .masthead h1{
    margin:10px 0 4px;
    font-family:var(--serif);
    font-weight:600;
    font-size:36px;
    line-height:1.15;
    letter-spacing:.01em;
  }
  .masthead h1 .dot{color:var(--accent);padding:0 3px;font-weight:400}
  .sub{margin:0;color:var(--muted);font-size:12.5px;letter-spacing:.02em}
  .rule{
    height:6px;
    border-top:2px solid var(--ink);
    border-bottom:1px solid var(--line);
    margin:16px 0 9px;
  }
  .meta-row{
    display:flex;justify-content:space-between;gap:12px;
    font-size:11.5px;color:var(--muted);
  }
  .brief{
    margin-top:18px;
    background:var(--card);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:3px;
    padding:15px 15px 13px;
    box-shadow:var(--shadow);
  }
  .brief-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .brief-head .label{
    font-size:10.5px;letter-spacing:.16em;color:var(--accent);

  }
  .brief-head .brief-date{font-size:11.5px;color:var(--muted)}
  .brief p{margin:8px 0 14px;font-size:14.5px;line-height:1.8;color:var(--ink-2)}
  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);
    border-top:1px dashed var(--line);
    padding-top:11px;
  }
  .stats>div{text-align:center;padding:0 6px}
  .stats>div+div{border-left:1px solid var(--line)}
  .stats b{
    display:block;font-family:var(--serif);font-weight:600;
    font-size:23px;line-height:1.15;
    font-variant-numeric:tabular-nums;
  }
  .stats span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;letter-spacing:.04em}
  .tabs{
    position:sticky;top:0;z-index:30;
    display:flex;
    margin:18px -18px 0;
    padding:9px 18px 0;
    background:color-mix(in srgb, var(--bg) 90%, transparent);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);

  }
  @supports not (background:color-mix(in srgb, red 50%, blue)){.tabs{background:var(--bg)}}
  .tabs button{
    flex:1;background:none;border:0;cursor:pointer;
    padding:9px 2px 12px;position:relative;
    font-size:13.5px;letter-spacing:.02em;color:var(--muted);

  }
  .tabs button.active{color:var(--ink);font-weight:600}
  .tabs button.active::after{
    content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:2px;background:var(--accent);
  }
  .tabs .count{
    display:inline-block;min-width:17px;margin-left:4px;padding:0 5px;
    font-size:10px;line-height:17px;border-radius:9px;
    background:var(--chip);color:var(--muted);font-weight:500;
    font-variant-numeric:tabular-nums;
  }
  .tabs button.active .count{background:var(--accent-soft);color:var(--accent)}
  .controls{margin-top:13px}
  .days{
    display:flex;gap:7px;overflow-x:auto;padding:1px 0 3px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .days::-webkit-scrollbar{display:none}
  .day{
    flex:0 0 auto;min-width:52px;
    background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:7px 7px 6px;text-align:center;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:border-color .15s ease, background .15s ease;
  }
  .day b{display:block;font-size:16px;line-height:1.1;font-weight:600;font-variant-numeric:tabular-nums}
  .day span{display:block;font-size:9.5px;color:var(--muted);margin-top:2px}
  .day i{display:block;font-style:normal;font-size:9.5px;color:var(--accent);margin-top:3px}
  .day.active{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .day.active span,.day.active i{color:color-mix(in srgb, var(--bg) 72%, transparent)}
  @supports not (color:color-mix(in srgb, red 50%, blue)){.day.active span,.day.active i{color:var(--bg);opacity:.72}}
  .filters{display:flex;align-items:center;gap:8px;margin-top:10px}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;padding:1px 0;scroll-behavior:smooth}
  .chips.fade{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent)}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;background:transparent;border:1px solid var(--line);border-radius:999px;
    padding:6px 11px;font-size:11.5px;color:var(--muted);cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .chip i{font-style:normal;opacity:.65;margin-left:3px;font-size:10px}
  .chip.active{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .chip.active i{opacity:.75}
  .chip.zero{opacity:.45}
  .search-toggle{
    flex:0 0 auto;width:36px;height:33px;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:999px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .searchbar{position:relative;margin-top:9px}
  .searchbar input{
    width:100%;padding:10px 74px 10px 12px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);font-size:13.5px;outline:none;
  }
  .searchbar input:focus{border-color:var(--accent)}
  .searchbar .clear{
    position:absolute;right:6px;top:5px;height:30px;padding:0 9px;
    background:transparent;border:0;color:var(--muted);font-size:12px;cursor:pointer;
  }
  .list{display:flex;flex-direction:column;gap:11px;margin-top:14px}
  .result-note{font-size:11.5px;color:var(--muted);padding:2px 1px 0}
  .day-head{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    padding:10px 2px 2px;
    font-size:11.5px;color:var(--muted);
  }
  .day-head b{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink)}
  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:13px 14px 11px;
    box-shadow:var(--shadow);
    animation:rise .32s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.card{animation:none}}
  @media (hover:hover){.card:hover{border-color:var(--line-strong)}}
  .card.featured{border-color:var(--line-strong)}
  .card.is-fav{border-color:color-mix(in srgb, var(--accent) 40%, var(--line))}
  @supports not (border-color:color-mix(in srgb, red 40%, blue)){.card.is-fav{border-color:var(--accent)}}
  .card-top{display:flex;align-items:center;gap:6px;min-height:26px}
  .cat{
    flex:0 0 auto;font-size:10px;letter-spacing:.06em;
    padding:2.5px 7px;border-radius:4px;
    background:var(--chip);color:var(--ink-2);
  }
  .cat.case{background:rgba(179,84,46,.12);color:#9c4827}
  .cat.exp{background:rgba(58,107,90,.12);color:#356553}
  .cat.comm{background:rgba(74,90,138,.12);color:#44547f}
  .cat.blog{background:rgba(138,90,158,.12);color:#7b4f8f}
  .cat.tool{background:rgba(107,107,58,.13);color:#62622f}
  .cat.policy{background:rgba(191,59,43,.1);color:#a83526}
  @media (prefers-color-scheme: dark){
    .cat.case{background:rgba(226,96,75,.16);color:#f0a08e}
    .cat.exp{background:rgba(104,170,144,.14);color:#9fd3bc}
    .cat.comm{background:rgba(130,150,210,.15);color:#b3c0e8}
    .cat.blog{background:rgba(190,140,210,.15);color:#d9b8e6}
    .cat.tool{background:rgba(190,190,120,.14);color:#d8d69a}
    .cat.policy{background:rgba(226,96,75,.14);color:#f0a08e}
  }
  .pick{
    flex:0 0 auto;font-size:9.5px;letter-spacing:.08em;
    color:var(--accent);border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    padding:2px 5px;border-radius:3px;
  }
  @supports not (border-color:color-mix(in srgb, red 35%, transparent)){.pick{border-color:var(--accent)}}
  .src{
    flex:1;min-width:0;
    font-size:11px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    letter-spacing:.01em;
  }
  .fav-btn{
    flex:0 0 auto;width:34px;height:34px;margin:-6px -7px -4px 0;
    display:grid;place-items:center;
    background:transparent;border:0;border-radius:50%;
    color:var(--muted);cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:color .15s ease,background .15s ease;
  }
  .fav-btn:hover{background:var(--chip)}
  .fav-btn[aria-pressed="true"]{color:var(--accent)}
  .fav-btn[aria-pressed="true"] svg{fill:currentColor}
  .title{
    margin:6px 0 5px;
    font-family:var(--serif);
    font-weight:600;
    font-size:18px;
    line-height:1.45;
    letter-spacing:.005em;
  }
  .title a{text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s ease}
  .title a:hover{border-color:var(--line-strong)}
  .summary{margin:0;font-size:13.5px;line-height:1.72;color:var(--ink-2)}
  .why{
    margin:9px 0 0;padding-left:9px;border-left:2px solid var(--accent);
    font-size:12.5px;line-height:1.6;color:var(--muted);
  }
  .why span{
    display:block;font-size:9.5px;letter-spacing:.12em;color:var(--accent);
    margin-bottom:1px;
  }
  .card-foot{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    margin-top:11px;padding-top:9px;border-top:1px dashed var(--line);
    font-size:11px;color:var(--muted);
  }
  .byline{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .foot-right{display:flex;align-items:baseline;gap:9px;flex:0 0 auto}
  .saved{font-size:10.5px;color:var(--accent)}
  .origin{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
  .origin:hover{border-color:var(--ink-2)}
  .empty{
    padding:54px 24px;text-align:center;color:var(--muted);
    border:1px dashed var(--line);border-radius:12px;background:var(--card);
  }
  .empty svg{opacity:.45;margin-bottom:8px}
  .empty h3{margin:0 0 6px;font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink)}
  .empty p{margin:0;font-size:13px;line-height:1.7}
  .fav-panel{
    border:1px dashed var(--line-strong);border-radius:12px;
    padding:13px 14px;background:transparent;
  }
  .fav-panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .fav-panel-head b{font-family:var(--serif);font-size:16px;font-weight:600}
  .fav-panel-head span{font-size:11px;color:var(--muted)}
  .fav-panel p{margin:6px 0 0;font-size:12px;line-height:1.65;color:var(--muted)}
  .fav-panel .warn{color:var(--accent)}
  .fav-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .btn{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:6px 11px;font-size:11.5px;color:var(--ink-2);cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:hover{border-color:var(--line-strong)}
  .btn input{display:none}
  .dir{
    margin-top:34px;border-top:2px solid var(--ink);padding-top:14px;
  }
  .dir details summary{
    list-style:none;cursor:pointer;
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:2px 0 10px;
  }
  .dir details summary::-webkit-details-marker{display:none}
  .dir details summary .dir-title{font-family:var(--serif);font-size:19px;font-weight:600}
  .dir details summary .dir-count{font-size:11px;color:var(--muted)}
  .dir details summary .chev{display:inline-block;transition:transform .2s ease;color:var(--muted);font-size:11px}
  .dir details[open] summary .chev{transform:rotate(180deg)}
  .dir-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding-bottom:6px}
  .dir h3{
    margin:4px 0 2px;font-size:10px;letter-spacing:.16em;color:var(--muted);
    text-transform:uppercase;font-weight:600;
  }
  .dir ul{list-style:none;margin:0;padding:0}
  .dir li{padding:8px 0;border-bottom:1px solid var(--line)}
  .dir li:last-child{border-bottom:0}
  .dir a{font-size:13.5px;text-decoration:none;color:var(--ink);border-bottom:1px solid transparent}
  .dir a:hover{border-color:var(--line-strong)}
  .dir .arrow{color:var(--muted);font-size:11px;margin-left:3px}
  .dir .why{display:block;margin:3px 0 0;padding:0;border:0;font-size:11px;color:var(--muted);line-height:1.55}
  footer{
    margin-top:30px;border-top:1px solid var(--line);padding-top:13px;
    font-size:11px;line-height:1.7;color:var(--muted);
  }
  footer p{margin:0}
  footer .note{color:var(--accent-2);margin-top:5px}
  footer .policy{margin-top:4px;opacity:.8}
  .toast{
    position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));
    transform:translate(-50%,14px);
    background:var(--ink);color:var(--bg);
    padding:9px 15px;border-radius:999px;
    font-size:12.5px;line-height:1.4;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
    z-index:100;max-width:calc(100vw - 34px);text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .top{
    position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));
    width:38px;height:38px;border-radius:50%;
    display:grid;place-items:center;
    background:var(--card);border:1px solid var(--line);color:var(--muted);
    box-shadow:var(--shadow);cursor:pointer;z-index:40;
    opacity:0;visibility:hidden;transform:translateY(6px);
    transition:opacity .2s ease,transform .2s ease,visibility .2s;
  }
  .top.show{opacity:1;visibility:visible;transform:none}
  .top svg{width:15px;height:15px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (min-width:700px){
    body{font-size:16px}
    .page{padding:34px 28px 84px}
    .masthead h1{font-size:44px}
    .brief{padding:18px 20px 15px}
    .brief p{font-size:15px}
    .card{padding:16px 18px 13px}
    .title{font-size:19.5px}
    .tabs{margin-left:-28px;margin-right:-28px;padding-left:28px;padding-right:28px}
  }
  @media (max-width:560px){
    .filters{align-items:flex-start}
    .chips{flex-wrap:wrap;overflow:visible;row-gap:6px}
    .chips.fade{-webkit-mask-image:none;mask-image:none}
    .days{gap:5px;overflow:visible}
    .day{flex:1 1 0;min-width:0;padding:6px 3px 5px}
    .day b{font-size:15px}
    .day span,.day i{font-size:9px}
  }
  @media (max-width:380px){
    .masthead h1{font-size:32px}
    .stats b{font-size:21px}
    .day b{font-size:14px}
    .src{font-size:10.5px}
  }
</style>
</head>

<a class="skip" href="#main">跳到内容</a>
<div class="page">
  <header class="masthead">
    <div class="kicker"><span>SOLO · INDIE · OPC</span><span id="mast-date">2026 · 11</span></div>
    <h1>一人公司<span class="dot">·</span>日报</h1>
    <p class="sub">每天 10:00 更新 · 只看最近 7 天 · 收藏不会过期</p>
    <div class="rule"></div>
    <div class="meta-row">
      <span id="today-label"></span>
      <span id="gen-label"></span>
    </div>
  </header>

  <section class="brief" aria-labelledby="brief-label">
    <div class="brief-head">
      <span class="label" id="brief-label">本期速览</span>
      <span class="brief-date" id="brief-date"></span>
    </div>
    <p id="brief-text"></p>
    <div class="stats">
      <div><b id="stat-day">0</b><span>本期条目</span></div>
      <div><b id="stat-week">0</b><span>近 7 天</span></div>
      <div><b id="stat-fav">0</b><span>已收藏</span></div>
    </div>
  </section>

  <nav class="tabs" aria-label="视图切换" role="tablist">
    <button type="button" role="tab" data-tab="day" class="active" aria-selected="true">日报</button>
    <button type="button" role="tab" data-tab="week" aria-selected="false">近 7 天</button>
    <button type="button" role="tab" data-tab="fav" aria-selected="false">收藏 <span class="count" id="tab-fav-count">0</span></button>
  </nav>

  <div class="controls">
    <div class="days" id="days" aria-label="选择日期"></div>
    <div class="filters">
      <div class="chips" id="chips" aria-label="按分类筛选"></div>
      <button type="button" class="search-toggle" id="search-toggle" aria-label="搜索" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.4-3.4"></path></svg>
      </button>
    </div>
    <div class="searchbar" id="searchbar" hidden>
      <input id="q" type="search" placeholder="搜标题、摘要、来源…" autocomplete="off" enterkeyhint="search" aria-label="搜索内容">
      <button type="button" class="clear" id="q-clear">清除</button>
    </div>
  </div>

  <main id="main">
    <div class="list" id="list"></div>
  </main>

  <section class="dir" aria-label="长期信源">
    <details>
      <summary>
        <span class="dir-title">长期信源</span>

const DATA = {"meta":{"title":"一人公司日报","generated":"2026-11-27T16:48:13+08:00","windowDays":7,"note":"2026-11-27 四次更新：在 33 条基础上补入 4 条中文一手内容——一人公司冷水数据、微信支付新协议、两人拉伸 App 流水、欧盟包裹税成本；Google Play 条目补上申报与公开时间表。","sourcePolicy":"收入、用户数与增长数据均为来源方自述，未经独立审计。"},"summaries":{"2026-11-27":"政策侧三条：Google Play 要求开发者在 2027 年 2 月前申报交易者身份，3 月起全球公开电话与地址；四川把个体户“个转企”与食品经营许可变更并成“一件事”，12 月 31 日全省推行；欧盟取消 150 欧免税并加收 3 欧/件，跨境单件成本多出约 5 欧。经营侧，1Password 的入侵提醒一人公司：一个 GitHub 账号就可能牵出全部家当；另外三条分别讲免费层样本量、邮件工具额度和输入隐私。","2026-11-26":"四条一人公司样本：Alarmy 一个人把闹钟做到年入 3400 万美元，BoltAI 从周末工具长到月入 1.5 万美元，BatchSet 拆掉注册墙才拿到第一笔 19.99 美元，21 岁学生做的 Makelead 已到 3k MRR。定价侧，MyFeedIn 和德国一人 IT 顾问都公开了真实价格。共同点不是 AI，而是先找到愿意付钱的人。","2026-11-25":"这天两条政策最硬：12 月 1 日起，公司找自然人做设计、咨询要代扣增值税；9 部门“春雨润苗”明确平台不得把涉税义务转嫁给小微商家。经营侧有四个冷水样本：98% 流量是机器人、19 年 Reddit 账号被封、退款规则该写在价格旁，以及 BlitzReels 靠老客户升级把 MRR 从 €911 拉到 €1,865；再加一个两人的拉伸 App，月流水 70–80 万美元。","2026-11-24":"五条一人公司样本。最值得先看的是这份冷水数据：全国一人公司超 1600 万家，30.8% 零营收，仅 20% 跑通闭环，65% 每月 AI 支出超 500 元。另有“一个人做出独角兽”的边界、零广告 3 天做到 487 美元 MRR 的分发过程、agency 最好月收 45.9 万美元却 6 个月关门的复盘；政策侧提醒微信支付 12 月 24 日新协议，个人码收经营款要补证件。","2026-11-23":"这天的样本都在拆“增长”：831 个注册只转出 58 个付费，ChatGPT 带来的用户是 Google 的 4 倍，3 周做 9 个 B2B 工具仍是 0 收入。另一条是 AI 游戏的真实分化：有人 3 天卖 10 万份，也有人月入不足 10 美元。","2026-11-22":"两条一人公司样本：一个人做产品做到 100+ 付费、月入约 3 千欧，仍保留清洁工工作；金融科技公司开始公开押注“单人创业者”群体。两条实操：试用期从 7 天砍到 3 天，以及 70% 终身折扣带来的 15 个流失用户。","2026-11-21":"两条英文一手复盘：一个人做内容站 7 周，真实流量只有每周 55 次，卡在收录；一个人卖 Mac 应用 3 周，237 次安装转出 83 位付费。共同点：先看真实转化，再谈增长。"},"items":[{"id":"2026-11-27-google-play-privacy","date":"2026-11-27","title":"Google Play 将公开个人开发者的电话与地址","url":"https://support.google.com/googleplay/android-developer/answer/17594752?hl=en","source":"Google Play 帮助中心","author":"Google","category":"政策","summary":"Google Play 要求活跃开发者在 2027 年 2 月 1 日前申报是否为“交易者”；被认定为交易者的个人账号，2027 年 3 月 1 日起要在全球页面公开电话和实体地址。Google 也不接受 P.O. Box 作为付款资料地址。","why":"个人开发者要么公开家庭住址，要么租商业地址；Apple 目前只在欧洲展示 trader 信息。","region":"en","featured":true},{"id":"2026-11-27-sichuan-gezhuanqi","date":"2026-11-27","title":"四川试点个体户“个转企”：12 月 31 日起全省推行","url":"https://www.pengxi.gov.cn/gongkai/show/3ed5faeff1ac9c6af12b97bf7d730dc1.html","source":"四川省市场监督管理局","author":"四川省市场监管局","category":"政策","region":"zh","summary":"四川把“个体工商户转型为企业”与食品经营许可变更并联办理，11 月 30 日至 12 月 30 日在绵阳、广元试点，12 月 31 日起全省推行；转型登记与许可证变更可一次申请，全流程控制在 7 个工作日内。","why":"一人公司做大后要不要从个体户转成公司，这类“一件事”改革会直接影响办理成本。"},{"id":"2026-11-27-eu-package-tax","date":"2026-11-27","title":"欧盟取消 150 欧免税再加 3 欧/件：跨境小卖家单件成本多出约 5 欧","url":"https://www.jiemian.com/article/15383107.html","source":"界面新闻","author":"程璐CL","category":"政策","summary":"2026 年黑五是欧盟取消 150 欧元以下包裹增值税豁免、并对每件加征 3 欧元固定税费后的首个大促；若叠加 11 月起的 2 欧元清关处理费，单件成本升至约 5 欧元。有卖家欧洲订单占比被砍半，注册一个经营主体要一万多元。","why":"做欧洲市场的独立站和平台卖家，要把税费、主体注册费和广告 CPI 放在一张表里重算。","region":"zh","featured":false},{"date":"2026-11-27","title":"一个人的公司，一个 GitHub 账号就能被端掉","url":"https://sspai.com/post/119632","source":"少数派 / 1Password","author":"少数派编辑部","category":"经验","summary":"攻击者通过一名员工的企业 GitHub 账号进入 1Password 内部系统，拿走部分用户姓名、邮箱、账户 ID、公钥、恢复令牌，以及私有仓库源码和 CI/CD 权限；密码库与 Secret Key 未受影响。官方称无需改密码，但冒充 1Password 的钓鱼风险上升。","why":"一人公司的 GitHub、CI/CD 和密码库往往就是全部家当，先收紧账号权限和恢复流程。","region":"zh","id":"2026-11-27-1password-incident"},{"date":"2026-11-27","title":"508 个免费用户零付费才是信号，47 个零付费可能只是噪声","url":"https://dev.to/ref_vid/zero-payers-out-of-508-is-evidence-zero-out-of-47-isnt-check-this-before-you-cut-a-free-tier-29e3","source":"Dev.to","author":"Louis Chi","category":"经验","summary":"一个小产品让 AI 代理审计免费层成本：若同类账户付费率约 2.1%，47 个零付费有 37% 概率是偶然，508 个零付费才是 0.002% 的异常；先算清 (1-p)^n，再决定要不要砍免费层。","why":"一人公司做增长决策，别被小样本的“零转化”吓到，也别拿它当借口。","region":"en","id":"2026-11-27-free-tier-sample"},{"date":"2026-11-27","title":"小工具该不该记住你输入的内容？","url":"https://dev.to/ranchjiao0607/should-a-tiny-web-tool-remember-what-you-typed-5h7e","source":"Dev.to","author":"Ranch Jiao","category":"经验","summary":"PasteCharm 的作者拆解一个很小的产品决策：收藏样式和草稿的“生命周期”不同，样式 ID 可以留在本地，用户输入的文本是否保留则涉及共享电脑与隐私预期；关键是让用户知道会发生什么。","why":"一人做小工具，隐私承诺往往藏在这种默认行为里。","region":"en","id":"2026-11-27-tiny-tool-privacy"},{"date":"2026-11-27","title":"一人建站选邮件工具：三个免费额度到底差在哪","url":"https://dev.to/aistackguide/three-free-email-tiers-three-different-bets-what-systemeio-mailerlite-and-kit-actually-give-a-ij4","source":"Dev.to / AI Stack Guide","author":"AI Stack Guide","category":"工具","summary":"对比 systeme.io、MailerLite 与 Kit 在 2026 年 11 月的免费方案：systeme.io 送整套漏斗和 1 条自动化，MailerLite 编辑器最好但只免 250 个订阅，Kit 名单额度最大却把关键自动化留到付费。","why":"一人公司起步时先按免费额度和第一档价格选型；文章含联盟链接，别只看推荐。","region":"en","id":"2026-11-27-email-free-tiers"},{"date":"2026-11-26","title":"Alarmy：一个人起步的闹钟 App，年收入 3400 万美元","url":"https://www.ezindie.com/weekly/issue-167","source":"独立开发变现周刊","author":"Ezindie / @kkashi_yt","category":"案例","summary":"2012 年作为副业项目起步，未拿投资，下载量超过 1 亿；靠解数学题、拍照、做深蹲才能关闹钟的强交互，把留存和广告曝光绑在一起，年收入 3400 万美元，近一半是利润。","why":"工具类 App 不靠融资也能做成现金牛，关键是行为设计与广告变现。","region":"zh","id":"2026-11-26-alarmy-solo","featured":true},{"date":"2026-11-26","title":"BoltAI：从周末小工具到月入 1.5 万美元","url":"https://dev.to/blobxiaoyao/from-agency-burnout-and-one-year-of-savings-to-15k-mrr-how-daniel-nguyen-built-boltai-4igf","source":"Dev.to / Applied AI Hub","author":"Yao Xiao","category":"案例","summary":"Daniel Nguyen 辞职做独立产品近一年，靠积蓄撑时间；为省去在 Xcode 与 ChatGPT 之间来回贴代码，用一个周末做出 BoltAI，如今单产品月收入超过 1.5 万美元，Mac 工具组合月入 3 万美元、利润率 85% 以上。","why":"先解决自己每天遇到的摩擦，再把它变成产品。","region":"en","id":"2026-11-26-boltai-15k"},{"date":"2026-11-26","title":"8 个月 287 个注册、1 笔 19.99 美元：先拆掉注册墙","url":"https://dev.to/muhayminbinmehmood/8-months-287-signups-one-payment-of-1999-4i9c","source":"Dev.to","author":"Muhaymin Bin Mehmood","category":"案例","summary":"前端开发者做图片工具箱 BatchSet，前四个月一共 24 个注册、零收入；把“先注册才能用”改成浏览器内直接处理后，8 个月累计 287 个注册，并在 11 月 25 日拿到第一笔 19.99 美元月付。","why":"小工具的第一道转化门槛，往往就是那个不必要的注册。","region":"en","id":"2026-11-26-batchset-signup-wall"},{"id":"2026-11-26-makelead-3k","date":"2026-11-26","title":"21 岁学生做 B2B 线索工具，3 个月做到 3k MRR","url":"https://www.ezindie.com/weekly/issue-167","source":"独立开发变现周刊 #167","author":"@SlakzieArt","category":"案例","region":"en","summary":"21 岁学生做 Makelead，把 LinkedIn 与 X 的潜客搜索、邀请、冷邮件、跟进和 AI 预约串成一条 B2B 获客流程，MRR 突破 3,000 美元。","why":"年轻一人公司不一定要做通用工具，垂直 B2B 工作流更容易收到钱。"},{"date":"2026-11-26","title":"把 SaaS 定价从 €10 终身改成 €19/月，他公开了完整价格史","url":"https://www.ezindie.com/weekly/issue-167","source":"独立开发变现周刊","author":"Ezindie / @aschapmann","category":"经验","summary":"Axel Schapmann 把 MyFeedIn 从 €10 终身买断一路调到 €19/月，并公开各价格点的客户数（€15/月时 65 人）；提价筛掉了价格敏感用户，也把产品推向更认真的客户。","why":"一人公司的定价不是算成本，是筛客户；真实价格史比理论更有参考价值。","region":"zh","id":"2026-11-26-myfeedin-pricing"},{"date":"2026-11-26","title":"德国一人 IT 顾问的真实报价：时薪 85–95 欧，日费 680 欧","url":"https://dev.to/qiangsheng/what-i-charge-as-a-one-person-it-consultant-in-germany-real-numbers-154j","source":"Dev.to","author":"Qiangsheng Huan","category":"经验","summary":"作者公开自己作为一人 IT 顾问的报价：小活 85 欧/小时，需签合同的 95 欧/小时，日费 680 欧，月度保留 1200 欧；固定价按 95 欧/小时估算再加 20% 缓冲，提价 15% 只失去 11 个客户中的 2 个。","why":"一人服务公司的定价可以公开透明，也可以靠报价结构过滤不合适的客户。","region":"en","id":"2026-11-26-it-consultant-rates"},{"id":"2026-11-26-ask-hn-openrouter-solo","date":"2026-11-26","title":"Ask HN：2026 年适合一个人做的 AI 生意","url":"https://news.ycombinator.com/item?id=50660683","source":"Hacker News","author":"Max-20","category":"社区","summary":"HN 讨论：什么 AI 产品既有真实价值，又能由一个人 bootstrapped 做出来？","why":"选题阶段的灵魂拷问，适合对照自己的方向。","region":"en"},{"id":"2026-11-25-vat-withholding","date":"2026-11-25","title":"12 月 1 日首次扣缴：公司找自然人做设计、咨询，要代扣增值税","url":"https://www.cnstock.com/commonDetail/833350/","source":"上海证券报","author":"李苑","category":"政策","region":"zh","featured":true,"summary":"11 月 1 日起，自然人向境内单位提供研发、软件、设计、咨询、影视制作、文化、教育七类服务，由付款单位代扣代缴增值税及附加，12 月 1 日首次申报。个体户不适用这套代扣机制，仍按现行规定自行申报。","why":"一人公司外包设计或开发给个人时，合同里的含税价和付款流程要提前改。"},{"id":"2026-11-25-98-percent-bots","date":"2026-11-25","title":"上线一个月，98% 的访问是机器人：22,351 次请求只有 483 个真人","url":"https://www.indiehackers.com/post/a-month-after-launch-98-of-my-traffic-is-still-bots-uxexY1nxeJHNTjEaTH66","source":"Indie Hackers","author":"Indie Hackers 社区","category":"经验","region":"en","summary":"作者上线一个月记录到 22,351 次请求，其中真人只有 483 个，占 2.2%；真人访问周线从 46 涨到 162，但只换来 2 个注册。把 bot 剔掉后，增长曲线会诚实很多。","why":"一人公司没有数据分析团队，先学会把爬虫和真人分开，否则会被假流量骗。"},{"id":"2026-11-25-blitzreels-mrr","date":"2026-11-25","title":"MRR 从 €911 到 €1,865：最大单日增长来自老客户升级","url":"https://www.ezindie.com/weekly/issue-167","source":"独立开发变现周刊 #167","author":"Virgile Rietsch","category":"案例","region":"en","summary":"一个人的短视频剪辑工具 BlitzReels，MRR 从一个月前的 €911 涨到第 7 天的 €1,865，完成 €10,000 目标的 18.7%；单日最大增长来自一位老客户升级全年 Agency。创始人接下来要逐一联系 21 名即将到期的试用用户。","why":"存量客户的升级和续费，往往比新客获客更快带来 MRR。"},{"id":"2026-11-25-bend-stretch-app","date":"2026-11-25","title":"两个人的拉伸 App：月流水 70–80 万美元，CPI 从 $2.38 降到 $1.44","url":"https://www.baijing.cn/article/56125","source":"白鲸出海","author":"裴政开","category":"案例","summary":"Bend 用 2 人核心团队切入健身里的拉伸场景，8 月流水破 100 万美元，目前稳定在 70–80 万美元/月；从买断转订阅后 CPI 从 2.38 美元降到 1.44 美元，同期安装量升到 7500 次。36% 的评论在提打卡、提醒和坚持，留存更多来自习惯设计而不是功能堆叠。","why":"极小团队做订阅 + 投放的一整套数字，可直接对照自己的获客成本与留存设计。","region":"zh","featured":false},{"id":"2026-11-25-refund-rules-pricing","date":"2026-11-25","title":"把退款规则写在价格旁边，而不是藏在条款里","url":"https://www.indiehackers.com/post/i-put-the-refund-rules-on-our-pricing-page-not-just-the-prices-LkG6UwsUnFVJaEXJdqHp","source":"Indie Hackers","author":"gudmundurk","category":"经验","region":"en","summary":"一个按 credits 计费的 AI 建站工具把退款规则放到定价页：改动前先给估算、没改动免费、模型调用失败自动退回、回滚和发布免费。作者还没给出转化数据，但把“怕白花钱”的顾虑提前回答了。","why":"一人公司的定价页往往只有价格，没有规则；信任感就丢在这一步。"},{"id":"2026-11-25-reddit-shadowban","date":"2026-11-25","title":"19 年的 Reddit 账号，一周内被 shadowban：一人公司的渠道风险","url":"https://www.indiehackers.com/post/19-years-on-reddit-and-now-shadowbanned-in-a-week-marketing-a-parenting-app-has-been-tricky-SgLtxs0vJR4oM3qoPrVF","source":"Indie Hackers","author":"Indie Hackers 社区","category":"经验","region":"en","summary":"一个用了 19 年的 Reddit 账号在推广育儿 App 时被全站 shadowban；同期 $30 的 TikTok 投放拿到近 1 万播放、0 下载，Product Hunt 只排到第 127 名。作者承认不确定封禁原因，但渠道集中风险是真的。","why":"把获客押在一个平台上，账号就是单点故障；一人公司要早点准备第二渠道。"},{"id":"2026-11-25-spring-rain","date":"2026-11-25","title":"9 部门“春雨润苗”：平台不得把涉税义务转嫁给小微商家","url":"https://guangdong.chinatax.gov.cn/gdsw/bmbscfxd_xdwj/2026-11/25/content_3b504cdcd2194af0a4b0f7c20e6caa96.shtml","source":"国家税务总局等 9 部门","author":"国家税务总局","category":"政策","region":"zh","summary":"税务总局等 9 部门发布 2026 年“春雨润苗”专项行动，15 项措施覆盖个体户转型、灵活就业参保、平台涉税信息报送与融资；明确严禁平台以转嫁涉税义务、额外收费等方式损害小微经营主体权益。","why":"一人公司多半在平台上经营，这条直接关系到平台代扣、收费和社保。"},{"id":"2026-11-25-ask-hn-ai-mrr","date":"2026-11-25","title":"Ask HN：AI 是否改写了独立开发者的收入？","url":"https://news.ycombinator.com/item?id=50645393","source":"Hacker News","author":"asdev","category":"社区","summary":"HN 发问：已经做到 1k MRR 以上的独立创始人，收入是否被 AI 改变？","why":"AI 在吃掉还是放大独立产品，需要更多一线样本。","region":"en"},{"id":"2026-11-24-opc-reality-check","date":"2026-11-24","title":"1600 万家一人公司，30.8% 零营收：一份给 OPC 的冷水数据","url":"https://finance.sina.cn/2026-11-24/detail-inizvkmk8982214.d.html","source":"界面新闻","author":"界面新闻","category":"经验","summary":"截至 2025 年 6 月，全国一人公司存量超 1600 万家、占企业总量 27.4%；36 氪调研显示 30.8% 没有营收，SoloNest 调查仅 20% 跑通商业闭环。65% 的 OPC 每月 AI 支出超 500 元，60% 把获客与销售列为最大困难，65% 的订单来自老客户和熟人。","why":"把“一人公司”从情绪拉回数字：先算固定 AI 成本与获客渠道，再决定要不要全职。","region":"zh","featured":true},{"id":"2026-11-24-one-person-unicorn","date":"2026-11-24","title":"一个人做出独角兽，可能就在这十年","url":"https://ajaychavda.com/blog/one-person-unicorn-is-likely-in-the-next-decade","source":"Ajay Chavda","author":"Ajay Chavda","category":"经验","summary":"作者用 AI 三个月独立重建整套 CMS，认为懂营销的技术创始人可能做出“一人独角兽”。","why":"样本虽小，但把单人加 AI 的产品交付链路讲得很具体。","region":"en","featured":false},{"id":"2026-11-24-487-mrr","date":"2026-11-24","title":"零广告 3 天做到 $487 MRR 的完整分发过程","url":"https://news.ycombinator.com/item?id=50635126","source":"Hacker News","author":"liftpill","category":"案例","summary":"为会计做的小工具，无受众无广告预算，靠精准社区发帖 3 天做到 487 美元 MRR（自述）。","why":"金额不大，“先找人、再发帖”的分发顺序值得抄。","region":"en"},{"id":"2026-11-24-agency-154k-failed","date":"2026-11-24","title":"Agency 最好一个月收 $45.9K，6 个月后关门：三个死因","url":"https://www.indiehackers.com/post/my-agency-billed-154k-then-failed-my-new-site-went-from-1-to-63-google-clicks-in-2-weeks-roast-the-offer-i-built-from-its-ashes-jy0S4IOROTLupjQBN6f8","source":"Indie Hackers","author":"Indie Hackers 社区","category":"经验","region":"en","summary":"一家小 agency 最好一个月做到 $45,900，6 个月后倒闭；作者重建单页后，两周把 Google 点击从 1 做到 63，但 4 周只拿到 1 次报价点击。收入峰值不等于生意成立，线索到报价之间还有一条断点。","why":"给接单型一人公司提个醒：先看报价点击和成交，不要只看流量和月流水。"},{"id":"2026-11-24-wechat-pay-agreement","date":"2026-11-24","title":"微信支付修订协议：个人码收经营款要补证件，12 月 24 日生效","url":"https://posts.tenpay.com/posts/584015036acde70500268f0c63a26442.html","source":"微信支付","author":"财付通","category":"政策","summary":"财付通 11 月 24 日修订《微信支付用户服务协议》，12 月 24 日生效：个人卖家、个人经营者、个体户经营人做经营性收款，要补充经营证件；单笔 1 万元以上、30 天累计 5 万元以上、余额连续 10 天超 5000 元等情形要核验身份。","why":"用个人收款码收软件费、咨询费的独立开发者，年底前要决定补资料还是换商户号。","region":"zh","featured":false},{"id":"2026-11-23-ai-games","date":"2026-11-23","title":"AI 游戏冰火两重天：3 天卖 10 万份，也有人月入不足 10 美元","url":"https://www.36kr.com/p/4081600709170312","source":"36氪 / DataEye","author":"DataEye研究院","category":"案例","summary":"《Slotbound》上线 3 天售出 10 万份；多款 AI 手游上线一个月收入不足 10 美元。","why":"AI 降低制作门槛，但需求判断与发行仍是生死线。","region":"zh","featured":true},{"id":"2026-11-23-831-signups-4160-mrr","date":"2026-11-23","title":"831 个注册、58 个付费、$4,160 MRR：第二个平台没接住","url":"https://www.indiehackers.com/post/831-signups-58-paying-4-160-mrr-we-ran-the-cut-we-promised-and-the-second-platform-story-didnt-survive-it-pwkmA2P52udXMBf5Yf0S","source":"Indie Hackers","author":"Indie Hackers 社区","category":"案例","region":"en","summary":"一款小产品先后在两个平台上线，累计 831 个注册、58 个付费，做到 $4,160 MRR；但第二个平台的故事没有通过数据检验，邮件驱动的付费率只有自然流量的一半。","why":"多平台分发不是复制粘贴，先看每个渠道的付费率，再决定要不要加码。"},{"id":"2026-11-23-chatgpt-4x-google","date":"2026-11-23","title":"ChatGPT 带来的用户是 Google 的 4 倍：528 次开始、314 次完成、3 个付费","url":"https://www.indiehackers.com/post/chatgpt-sends-my-side-project-4x-more-users-than-google-and-i-didnt-plan-for-it-0BvPXQLNnR9F7g3F92Xy","source":"Indie Hackers","author":"Indie Hackers 社区","category":"经验","region":"en","summary":"一个 side project 的流量里，ChatGPT 带来 37 个用户，Google 只有 9 个；528 次开始使用、314 次完成、3 人付费。作者没为 AI 搜索做优化，用户却从聊天机器人里来了。","why":"一人公司没有预算投广告，值得重新检查产品在 AI 回答里的可发现性。"},{"id":"2026-11-23-9-b2b-tools-zero","date":"2026-11-23","title":"3 周做 9 个 B2B 小工具，170 次运行，收入 0","url":"https://www.indiehackers.com/post/9-b2b-data-tools-shipped-in-3-weeks-0-revenue-so-far-what-id-do-differently-s5JnxKKxVjqD9JFjBDJ7","source":"Indie Hackers","author":"Indie Hackers 社区","category":"经验","region":"en","summary":"作者 3 周上线 9 个 B2B 数据小工具，累计约 170 次运行，收入仍是 0。复盘结论不是做得不够多，而是每个工具都停在“能用”，没有解决一个必须付钱的问题。","why":"一人公司最容易陷入“多做一个工具”的忙碌，这篇是失败复盘样本。"},{"id":"2026-11-22-100-paying-clean-offices","date":"2026-11-22","title":"100 个付费客户、月入约 3 千欧，他还在做清洁工","url":"https://www.indiehackers.com/post/100-paying-customers-a-few-months-at-3k-and-i-still-clean-offices-OfqAbladE1bswpPuYa3E","source":"Indie Hackers","author":"Indie Hackers 社区","category":"案例","region":"en","featured":true,"summary":"一个人做产品几个月，积累 100+ 付费客户、700+ 次付费构建，月收入约 3,000 欧元；他仍保留清洁工工作，用稳定现金流换试错时间。","why":"一人公司最现实的安全垫：先让副业赚到钱，再决定要不要辞职。"},{"id":"2026-11-22-solo-goldrush","date":"2026-11-22","title":"AI 工具催生“单人创业者”淘金热","url":"https://finance.sina.cn/2026-11-22/detail-inizqmrn9094806.d.html","source":"新浪财经 / 格隆汇","author":"格隆汇","category":"案例","summary":"Novo 创始人称 AI 将引爆单人创业者增长，Anthropic 推进 IPO 或加速这一趋势。","why":"海外金融基础设施开始专门服务一人公司，信号意义大于新闻本身。","region":"zh"},{"id":"2026-11-22-trial-7-to-3-days","date":"2026-11-22","title":"把免费试用从 7 天砍到 3 天：8 个付费客户都在前 3 天付款","url":"https://www.indiehackers.com/post/we-cut-our-free-trial-from-7-days-to-3-every-paying-customer-had-paid-within-3-days-anyway-XTUjvKXVEbzA5OPXcQWH","source":"Indie Hackers","author":"Indie Hackers 社区","category":"经验","region":"en","summary":"作者把试用期从 7 天改成 3 天后，8 位付费客户全部在第 0–3 天完成付款；此前的 7 天组 20 个团队没有一单。试用越长不等于转化越好，关键是把决策窗口压短。","why":"定价和试用期是可以直接做 A/B 的两个杠杆，别凭感觉设 7 天或 14 天。"},{"id":"2026-11-22-lifetime-deal-pricing","date":"2026-11-22","title":"70% 终身折扣卖了 40 单：15 个用户在折扣结束后流失","url":"https://www.indiehackers.com/post/one-week-into-a-70-off-lifetime-deal-5-pricing-lessons-for-bootstrapped-saas-4TvLlz18cUpFEV55ODkF","source":"Indie Hackers","author":"Indie Hackers 社区","category":"经验","region":"en","summary":"作者用 70% 折扣卖终身方案，把底价定在 $3/月×36 个月=$108；40 个折扣用户里有 15 个在折扣结束后流失。终身交易能换现金，但会把未来收入一次性折现。","why":"黑五前后最容易冲动上终身 deal，先用这篇算清 LTV 和流失。"},{"id":"2026-11-21-grooming-honest-numbers","date":"2026-11-21","title":"一个人做内容站 7 周：每周 55 个真人访问，131 条外链，卡在收录","url":"https://www.indiehackers.com/post/seven-weeks-in-the-honest-numbers-behind-a-one-person-grooming-site-cZFhc7nh0GAbqMe7UEQ0","source":"Indie Hackers","author":"Louis Carter","category":"经验","region":"en","summary":"一个人做男士渐变发型指南站，7 周后真实流量约每周 55 次访问；一次 869 次访问里 829 次来自同一数据中心的爬虫。131 条外链大多还没被收录，他的结论是：内容不是瓶颈，收录才是。","why":"给所有靠 SEO 起步的一人内容站一个冷水样本：先把爬虫和真人分开，再谈增长。"},{"id":"2026-11-21-mac-app-237-installs","date":"2026-11-21","title":"3 周卖出 83 份：一个 Mac 小应用的安装转付费样本","url":"https://www.indiehackers.com/post/what-3-weeks-of-selling-a-mac-app-taught-me-237-installs-83-customers-no-funding-DdWxg9wc8jk3ENpG09w0","source":"Indie Hackers","author":"Indie Hackers 社区","category":"案例","region":"en","summary":"一个人卖 Mac 应用，3 周拿到 237 次安装、83 位付费用户，安装转付费约 35%，没有融资。作者复盘了定价、试用和发布渠道的具体做法。","why":"小工具不靠融资也能跑出正现金流，关键看安装到付费这一段转化。"}],"directory":{"communities":[{"name":"Indie Hackers","url":"https://www.indiehackers.com","lang":"en","why":"独立开发者与 bootstrapped 创始人的主社区，营收复盘多"},{"name":"r/indiebiz","url":"https://www.reddit.com/r/indiebiz/","lang":"en","why":"小项目、独立生意的提问与复盘"},{"name":"电鸭社区","url":"https://eleduck.com","lang":"zh","why":"远程工作、自由职业与数字游民交流"},{"name":"少数派 Matrix","url":"https://sspai.com/matrix","lang":"zh","why":"中文产品、效率与独立创作的长文社区"},{"name":"V2EX · 分享创造","url":"https://www.v2ex.com/go/create","lang":"zh","why":"中文独立开发者的作品发布与反馈集中地"},{"name":"生财有术","url":"https://scys.com","lang":"zh","why":"中文副业与个体创业社群（付费）"}],"bloggers":[{"name":"Pieter Levels","platform":"X / levels.io","url":"https://levels.io","lang":"en","why":"一人多产品，公开营收与实验过程"},{"name":"Marc Lou","platform":"X / marclou.com","url":"https://marclou.com",   const DIRECTORY = DATA.directory || {communities:[], bloggers:[]};
  const CATS = ["全部","案例","经验","社区","博主","工具","政策"];
  const FAV_KEY = "opc-favs-v1";
  const WINDOW_DAYS = Number(META.windowDays) || 7;
  const DAY_MS = 86400000;

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
  const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
  const safeUrl = (u) => /^https?:\/\//i.test(String(u || "")) ? String(u) : "#";
  const parseYmd = (s) => {
    const p = String(s || "").split("-").map(Number);
    return new Date(p[0] || 1970, (p[1] || 1) - 1, p[2] || 1);
  };
  const ymd = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const fmtMd = (s) => { const d = parseYmd(s); return (d.getMonth() + 1) + "月" + d.getDate() + "日"; };
  const fmtWeekday = (s) => "日一二三四五六"[parseYmd(s).getDay()];
  const fmtDateTime = (iso) => {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso || "");
    return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  };
  const fmtCST = (iso) => {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso || "");
    try {
      return new Intl.DateTimeFormat("zh-CN", {timeZone:"Asia/Shanghai", month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit", hour12:false}).format(d);
    } catch (err) {
      return fmtDateTime(iso);
    }
  };
  const cstParts = (iso) => {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return {year:"", month:""};
    try {
      const parts = new Intl.DateTimeFormat("en-CA", {timeZone:"Asia/Shanghai", year:"numeric", month:"numeric"}).formatToParts(d);
      const get = (t) => (parts.find(function(p){ return p.type === t; }) || {}).value || "";
      return {year:get("year"), month:get("month")};
    } catch (err) {
      return {year:String(d.getFullYear()), month:String(d.getMonth() + 1)};
    }
  };

  const allDates = Array.from(new Set(ITEMS.map(function(i){ return i.date; }).filter(Boolean))).sort().reverse();
  const latest = allDates[0] || ymd(new Date());
  const latestTime = parseYmd(latest).getTime();
  const windowDates = allDates.filter(function(d){
    return (latestTime - parseYmd(d).getTime()) / DAY_MS <= WINDOW_DAYS - 1;
  });
  const windowItems = ITEMS.filter(function(i){ return windowDates.indexOf(i.date) !== -1; });
  const byId = {};
  ITEMS.forEach(function(i){ if (i.id) byId[i.id] = i; });

  const state = {
    tab: location.hash === "#week" ? "week" : (location.hash === "#fav" ? "fav" : "day"),
    day: latest,
    cat: "全部",
    q: ""
  };

  let favs = {};
  let canStore = true;
  try {
    const probe = "__opc_probe__";
    localStorage.setItem(probe, "1");
    localStorage.removeItem(probe);
    const raw = localStorage.getItem(FAV_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const source = parsed && parsed.items && typeof parsed.items === "object" ? parsed.items : parsed;
      if (source && typeof source === "object" && !Array.isArray(source)) {
        Object.keys(source).forEach(function(k){
          const rec = source[k];
          if (rec && rec.item && rec.item.title && rec.item.url) favs[k] = rec;
        });
      }
    }
  } catch (err) {
    canStore = false;
  }

  const toastEl = $("#toast");
  let toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2200);
  }

  function persistFavs(){
    if (!canStore) { toast("当前打开方式无法保存收藏，换用固定网址即可长期保留"); return false; }
    try {
      localStorage.setItem(FAV_KEY, JSON.stringify({v:1, items:favs}));
      return true;
    } catch (err) {
      canStore = false;
      toast("本地存储写入失败，请先导出备份");
      return false;
    }
  }

  function favCount(){ return Object.keys(favs).length; }

  function syncFavButtons(){
    $$(".fav-btn").forEach(function(btn){
      const key = btn.getAttribute("data-fav");
      const on = !!favs[key];
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      btn.setAttribute("aria-label", on ? "取消收藏" : "收藏");
    });
    $("#tab-fav-count").textContent = String(favCount());
    $("#stat-fav").textContent = String(favCount());
  }

  function matches(item){
    if (state.cat !== "全部" && item.category !== state.cat) return false;
    if (!state.q) return true;
    const q = state.q.toLowerCase();
    return [item.title, item.summary, item.why, item.source, item.author].some(function(v){
      return String(v || "").toLowerCase().indexOf(q) !== -1;
    });
  }

  function card(item, opts){
    opts = opts || {};
    const key = opts.key || item.id || item.url;
    const isFav = !!favs[key];
    const featured = !!item.featured && state.tab === "day" && !state.q;
    const catKey = {"案例":"case","经验":"exp","社区":"comm","博主":"blog","工具":"tool","政策":"policy","工具政策":"tool"}[item.category] || "tool";
    const saved = opts.savedAt ? '<span class="saved">收藏于 ' + esc(fmtDateTime(opts.savedAt)) + '</span>' : "";
    const region = item.region === "zh" ? "中文" : "EN";
    return '<article class="card' + (featured ? " featured" : "") + (isFav ? " is-fav" : "") + '">' +
      '<div class="card-top">' +
        '<span class="cat ' + catKey + '">' + esc(item.category || "其他") + '</span>' +
        (featured ? '<span class="pick">精选</span>' : "") +
        '<span class="src">' + esc(item.source || "") + ' · ' + esc(item.date ? fmtMd(item.date) : "") + '</span>' +
        '<button type="button" class="fav-btn" data-fav="' + esc(key) + '" aria-pressed="' + isFav + '" aria-label="' + (isFav ? "取消收藏" : "收藏") + '">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4.3L5.5 20.5v-16a1 1 0 0 1 1-1Z"/></svg>' +
        '</button>' +
      '</div>' +
      '<h3 class="title"><a href="' + safeUrl(item.url) + '" target="_blank" rel="noopener noreferrer">' + esc(item.title) + '</a></h3>' +
      '<p class="summary">' + esc(item.summary) + '</p>' +
      '<p class="why"><span>为什么看</span>' + esc(item.why) + '</p>' +
      '<div class="card-foot">' +
        '<span class="byline">' + esc(item.author || item.source || "") + ' · ' + region + '</span>' +
        '<span class="foot-right">' + saved + '<a class="origin" href="' + safeUrl(item.url) + '" target="_blank" rel="noopener noreferrer">原文 ↗</a></span>' +
      '</div>' +
    '</article>';
  }

  function emptyState(kind){
    if (kind === "fav") {
      return '<div class="empty">' +
        '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4.3L5.5 20.5v-16a1 1 0 0 1 1-1Z"/></svg>' +
        '<h3>还没有收藏</h3><p>点每条内容右上角的书签。收藏后会一直保留，<br>即使它已经滚出 7 天窗口。</p></div>';
    }
    return '<div class="empty">' +
      '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.4-3.4"></path></svg>' +
      '<h3>这里暂时没有内容</h3><p>换个分类或日期看看，<br>也可以切到「近 7 天」浏览全部。</p></div>';
  }

  function renderDays(){
    const wrap = $("#days");
    wrap.style.display = state.tab === "fav" ? "none" : "flex";
    wrap.innerHTML = windowDates.map(function(d){
      const n = ITEMS.filter(function(i){ return i.date === d; }).length;
      const active = state.tab === "day" && state.day === d;
      return '<button type="button" class="day' + (active ? " active" : "") + '" data-day="' + esc(d) + '" aria-pressed="' + active + '" aria-label="' + esc(fmtMd(d)) + '，' + n + ' 条">' +
        '<b>' + parseYmd(d).getDate() + '</b><span>周' + fmtWeekday(d) + '</span><i>' + n + ' 条</i></button>';
    }).join("");
  }

  function renderChips(){
    let pool;
    if (state.tab === "fav") {
      pool = Object.keys(favs).map(function(k){ return favs[k].item; });
    } else if (state.tab === "day" && !state.q) {
      pool = ITEMS.filter(function(i){ return i.date === state.day; });
    } else {
      pool = windowItems;
    }
    $("#chips").innerHTML = CATS.filter(function(c){
      return c === "全部" || c === state.cat || pool.some(function(i){ return i.category === c; });
    }).map(function(c){
      const n = c === "全部" ? pool.length : pool.filter(function(i){ return i.category === c; }).length;
      const active = state.cat === c;
      return '<button type="button" class="chip' + (active ? " active" : "") + (n === 0 ? " zero" : "") + '" data-cat="' + esc(c) + '" aria-pressed="' + active + '">' + esc(c) + '<i>' + n + '</i></button>';
    }).join("");
    const wrap = $("#chips");
    const activeChip = wrap.querySelector(".chip.active");
    if (activeChip) {
      const r = activeChip.getBoundingClientRect();
      const w = wrap.getBoundingClientRect();
      if (r.right > w.right - 8 || r.left < w.left + 8) activeChip.scrollIntoView({inline:"center", block:"nearest"});
    }
    updateChipFade();
  }

  function updateChipFade(){
    const el = $("#chips");
    el.classList.toggle("fade", el.scrollWidth - el.clientWidth - el.scrollLeft > 4);
  }

  function renderBrief(){
    const label = $("#brief-label");
    const dateEl = $("#brief-date");
    const text = $("#brief-text");
    if (state.tab === "fav") {
      label.textContent = "收藏说明";
      dateEl.textContent = favCount() + " 条 · 本机保存";
      text.textContent = "收藏保存在当前浏览器里，不随 7 天窗口滚动，也不会被自动删除。换设备或清理浏览器数据前，记得先导出备份。";
    } else if (state.tab === "week") {
      label.textContent = "近 7 天";
      dateEl.textContent = windowItems.length + " 条 · " + (windowDates.length ? fmtMd(windowDates[windowDates.length - 1]) + "—" + fmtMd(windowDates[0]) : "");
      text.textContent = SUMMARIES[latest] || "近 7 天的内容都在这里，按日期从新到旧排列。";
    } else {
      label.textContent = "本期速览";
      dateEl.textContent = fmtMd(state.day) + " · 周" + fmtWeekday(state.day);
      text.textContent = SUMMARIES[state.day] || "这一天暂无手写摘要，直接看下面的条目。";
    }
    $("#stat-day").textContent = String(ITEMS.filter(function(i){ return i.date === state.day; }).length);
    $("#stat-week").textContent = String(windowItems.length);
    $("#stat-fav").textContent = String(favCount());
  }

  function renderList(){
    const list = $("#list");
    let pool = [];
    let grouped = false;
    if (state.tab === "fav") {
      pool = Object.keys(favs).map(function(k){
        const rec = favs[k];
        const item = rec.item;
        return Object.assign({}, item, {__key:k, __saved:rec.savedAt});
      }).sort(function(a,b){ return String(b.__saved || "").localeCompare(String(a.__saved || "")); });
    } else if (state.tab === "day" && !state.q) {
      pool = ITEMS.filter(function(i){ return i.date === state.day; });
    } else {
      pool = windowItems.slice();
      grouped = true;
    }

    pool = pool.filter(matches);

    let html = "";
    if (state.tab === "fav") {
      html += '<div class="fav-panel">' +
        '<div class="fav-panel-head"><b>本地收藏</b><span>' + favCount() + ' 条 · 永久保留</span></div>' +
        '<p>收藏保存在本机浏览器，不会因为滚出 7 天窗口而消失。清理浏览器数据或换设备前，先导出备份。</p>' +
        (canStore ? "" : '<p class="warn">当前打开方式无法写入本地存储，收藏仅在本次浏览有效。使用固定网址访问即可长期保存。</p>') +
        '<div class="fav-actions">' +
          '<button type="button" class="btn" id="export-favs">导出备份</button>' +
          '<label class="btn">导入备份<input type="file" id="import-favs" accept="application/json,.json"></label>' +
        '</div>' +
      '</div>';
    }

    if (!pool.length) {
      html += emptyState(state.tab === "fav" ? "fav" : "list");
      list.innerHTML = html;
      syncFavButtons();
      return;
    }

    if (state.q) {
      html += '<div class="result-note">“' + esc(state.q) + '” · ' + pool.length + ' 条结果' +
        (state.cat !== "全部" ? " · " + esc(state.cat) : "") + '</div>';
    }

    if (grouped) {
      const groups = {};
      pool.forEach(function(i){
        const d = i.date || "";
        (groups[d] = groups[d] || []).push(i);
      });
      Object.keys(groups).sort().reverse().forEach(function(d){
        html += '<div class="day-head"><b>' + esc(fmtMd(d)) + '</b><span>周' + fmtWeekday(d) + ' · ' + groups[d].length + ' 条</span></div>';
        html += groups[d].map(function(i){ return card(i, {}); }).join("");
      });
    } else if (state.tab === "fav") {
      html += pool.map(function(i){
        return card(i, {key:i.__key, savedAt:i.__saved});
      }).join("");
    } else {
      html += pool.map(function(i){ return card(i, {}); }).join("");
    }

    list.innerHTML = html;
    syncFavButtons();
  }

  function render(){
    renderDays();
    renderChips();
    renderBrief();
    renderList();
    $$(".tabs button").forEach(function(b){
      const on = b.getAttribute("data-tab") === state.tab;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
  }

  function setTab(tab){
    if (tab === state.tab) return;
    state.tab = tab;
    if (tab === "day" && !state.day) state.day = latest;
    if (tab === "week") history.replaceState(null, "", "#week");
    else if (tab === "fav") history.replaceState(null, "", "#fav");
    else history.replaceState(null, "", location.pathname + location.search);
    render();
  }

  function toggleFav(key){
    const existing = favs[key];
    if (existing) {
      delete favs[key];
      toast("已取消收藏");
    } else {
      const item = byId[key] || (existing && existing.item);
      const source = item || ITEMS.filter(function(i){ return (i.id || i.url) === key; })[0];
      if (!source) return;
      favs[key] = {item: JSON.parse(JSON.stringify(source)), savedAt: new Date().toISOString()};
      toast(canStore ? "已收藏，会一直保留" : "已收藏（本次浏览有效）");
    }
    persistFavs();
    syncFavButtons();
    if (state.tab === "fav") renderList();
    renderBrief();
  }

  function exportFavs(){
    const payload = {v:1, exportedAt:new Date().toISOString(), items:favs};
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const d = new Date();
    a.href = url;
    a.download = "一人公司日报-收藏-" + d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0") + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast("已导出 " + favCount() + " 条收藏");
  }

  function importFavs(file){
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      try {
        const parsed = JSON.parse(String(reader.result || "{}"));
        const incoming = parsed && parsed.items && typeof parsed.items === "object" ? parsed.items : parsed;
        let added = 0;
        if (Array.isArray(incoming)) {
          incoming.forEach(function(item){
            if (!item || !item.title || !item.url) return;
            const key = item.id || item.url;
            favs[key] = {item:item, savedAt:new Date().toISOString()};
            added++;
          });
        } else if (incoming && typeof incoming === "object") {
          Object.keys(incoming).forEach(function(k){
            const rec = incoming[k];
            if (!rec || !rec.item || !rec.item.title || !rec.item.url) return;
            if (!favs[k]) added++;
            favs[k] = rec;
          });
        }
        persistFavs();
        syncFavButtons();
        renderBrief();
        renderList();
        toast("已导入 " + added + " 条收藏");
      } catch (err) {
        toast("导入失败：文件格式不对");
      }
    };
    reader.readAsText(file);
  }

  document.addEventListener("click", function(e){
    const tabBtn = e.target.closest(".tabs button");
    if (tabBtn) { setTab(tabBtn.getAttribute("data-tab")); return; }

    const dayBtn = e.target.closest(".day");
    if (dayBtn) {
      state.tab = "day";
      state.day = dayBtn.getAttribute("data-day");
      history.replaceState(null, "", location.pathname + location.search);
      render();
      return;
    }

    const chip = e.target.closest(".chip");
    if (chip) { state.cat = chip.getAttribute("data-cat"); render(); return; }

    const favBtn = e.target.closest(".fav-btn");
    if (favBtn) { toggleFav(favBtn.getAttribute("data-fav")); return; }

    if (e.target.closest("#export-favs")) { exportFavs(); return; }

    const searchToggle = e.target.closest("#search-toggle");
    if (searchToggle) {
      const bar = $("#searchbar");
      const open = bar.hasAttribute("hidden");
      if (open) { bar.removeAttribute("hidden"); searchToggle.setAttribute("aria-expanded","true"); $("#q").focus(); }
      else { bar.setAttribute("hidden",""); searchToggle.setAttribute("aria-expanded","false"); }
      return;
    }

    if (e.target.closest("#q-clear")) {
      const input = $("#q");
      input.value = "";
      state.q = "";
      input.focus();
      render();
    }
  });

  document.addEventListener("change", function(e){
    if (e.target && e.target.id === "import-favs") {
      importFavs(e.target.files && e.target.files[0]);
      e.target.value = "";
    }
  });

  document.addEventListener("input", function(e){
    if (e.target && e.target.id === "q") {
      state.q = e.target.value.trim();
      if (state.q && state.tab === "fav") { /* keep fav tab */ }
      render();
    }
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      e.preventDefault();
      const bar = $("#searchbar");
      if (bar.hasAttribute("hidden")) {
        bar.removeAttribute("hidden");
        $("#search-toggle").setAttribute("aria-expanded","true");
      }
      $("#q").focus();
    }
    if (e.key === "Escape" && document.activeElement && document.activeElement.id === "q") {
      if (!state.q) {
        $("#searchbar").setAttribute("hidden","");
        $("#search-toggle").setAttribute("aria-expanded","false");
      }
    }
  });

  const topBtn = $("#top");
  $("#chips").addEventListener("scroll", updateChipFade, {passive:true});
  window.addEventListener("resize", updateChipFade, {passive:true});
  window.addEventListener("scroll", function(){
    topBtn.classList.toggle("show", window.scrollY > 620);
  }, {passive:true});
  topBtn.addEventListener("click", function(){
    window.scrollTo({top:0, behavior:"smooth"});
  });

  window.addEventListener("hashchange", function(){
    const tab = location.hash === "#week" ? "week" : (location.hash === "#fav" ? "fav" : "day");
    if (tab !== state.tab) { state.tab = tab; render(); }
  });

  function init(){
    const latestDate = parseYmd(latest);
    $("#today-label").textContent = latestDate.getFullYear() + "年" + fmtMd(latest) + " · 周" + fmtWeekday(latest);
    const mp = cstParts(META.generated);
    if (mp.year && mp.month) $("#mast-date").textContent = mp.year + " · " + mp.month;
    $("#gen-label").textContent = "更新于 " + fmtCST(META.generated);
    $("#tab-fav-count").textContent = String(favCount());
    $("#stat-fav").textContent = String(favCount());

    const dirCount = (DIRECTORY.communities || []).length + (DIRECTORY.bloggers || []).length;
    $("#dir-count").textContent = String(dirCount);
    $("#dir-grid").innerHTML =
      '<div><h3>社区</h3><ul>' + (DIRECTORY.communities || []).map(function(c){
        return '<li><a href="' + safeUrl(c.url) + '" target="_blank" rel="noopener noreferrer">' + esc(c.name) + '<span class="arrow">↗</span></a>' +
          '<span class="why">' + esc(c.why) + '</span></li>';
      }).join("") + '</ul></div>' +
      '<div><h3>创作者</h3><ul>' + (DIRECTORY.bloggers || []).map(function(b){
        return '<li><a href="' + safeUrl(b.url) + '" target="_blank" rel="noopener noreferrer">' + esc(b.name) + '<span class="arrow">↗</span></a>' +
          '<span class="why">' + esc(b.platform || "") + (b.platform ? " · " : "") + esc(b.why) + '</span></li>';
      }).join("") + '</ul></div>';

    const first = windowDates.length ? windowDates[windowDates.length - 1] : latest;
    const last = windowDates.length ? windowDates[0] : latest;
    $("#foot-window").textContent = "数据窗口：" + fmtMd(first) + " — " + fmtMd(last) + " · 共 " + windowItems.length + " 条 · 只展示最近 " + WINDOW_DAYS + " 天";
    $("#foot-gen").textContent = "生成于 " + fmtCST(META.generated) + "（CST） · 收藏保存在本机浏览器";
    $("#foot-note").textContent = META.note || "";
    $("#foot-policy").textContent = META.sourcePolicy || "";

    render();
  }

  init();
})();
</script>
</body>
</html>
